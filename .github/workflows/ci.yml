name: CI

on:
  push:
    branches: ["main", "complete-phase-1-and-2"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://invoiceguard:ci-only-password@localhost:5432/invoiceguard?schema=public
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
      POSTGRES_PASSWORD: ci-only-password
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate --workspace=@invoiceguard/api

      - name: Validate Prisma schema
        run: npx prisma validate --schema backend/database/prisma/schema.prisma

      - name: Install PDF and OCR test dependencies
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-eng

      - name: Run isolated Tesseract OCR regression test
        run: npm test --workspace=@invoiceguard/api -- src/lib/document-extraction.test.ts -t "recognizes text in supported invoice images with Tesseract"

      - name: Run backend tests
        run: npm test --workspace=@invoiceguard/api

      - name: Build backend and frontend
        run: npm run build

      - name: Check frontend TypeScript
        run: npx tsc --noEmit -p frontend/tsconfig.json

      - name: Validate Render Blueprint YAML
        run: ruby -e 'require "yaml"; spec = YAML.safe_load_file("render.yaml"); abort "Expected two Render services" unless spec.fetch("services").length == 2; abort "Missing API health check" unless spec.fetch("services").any? { |service| service["name"] == "invoiceguard-api" && service["healthCheckPath"] == "/api/health" }'

      - name: Validate Docker Compose configuration
        run: |
          touch backend/.env frontend/.env
          docker compose config --quiet

      - name: Build backend production image
        run: docker build --tag invoiceguard-api:ci --target production -f backend/Dockerfile backend

      - name: Verify PDF and OCR binaries in backend image
        run: docker run --rm --entrypoint sh invoiceguard-api:ci -c "pdftotext -v >/dev/null 2>&1 && pdftoppm -v >/dev/null 2>&1 && tesseract --list-langs 2>/dev/null | grep -qx eng"
      - name: Build frontend production image
        run: docker build --build-arg NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" --target production -f frontend/Dockerfile frontend
